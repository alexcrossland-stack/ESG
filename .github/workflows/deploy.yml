name: Deploy to Hetzner

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: "Type production to confirm this deploy targets production"
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      CONFIRM_TARGET: ${{ inputs.confirm_target }}
      PRODUCTION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PRODUCTION_SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      PRODUCTION_MFA_ENCRYPTION_KEY: ${{ secrets.MFA_ENCRYPTION_KEY }}
      PRODUCTION_APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      PRODUCTION_CSRF_TRUSTED_ORIGINS: ${{ secrets.CSRF_TRUSTED_ORIGINS }}
      PRODUCTION_REPLIT_DOMAINS: ${{ secrets.REPLIT_DOMAINS }}
      PRODUCTION_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      PRODUCTION_AI_INTEGRATIONS_OPENAI_API_KEY: ${{ secrets.AI_INTEGRATIONS_OPENAI_API_KEY }}
      PRODUCTION_AI_INTEGRATIONS_OPENAI_BASE_URL: ${{ secrets.AI_INTEGRATIONS_OPENAI_BASE_URL }}
      PRODUCTION_AI_INTEGRATIONS_OPENAI_MODEL: ${{ secrets.AI_INTEGRATIONS_OPENAI_MODEL }}
      PRODUCTION_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      PRODUCTION_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      PRODUCTION_STRIPE_PRO_PRICE_ID: ${{ secrets.STRIPE_PRO_PRICE_ID }}

    steps:
      - name: Validate production deploy confirmation
        run: |
          set -Eeuo pipefail
          if [ "${CONFIRM_TARGET}" != "production" ]; then
            echo "::error::confirm_target must be exactly 'production'"
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Start ssh-agent and add deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'echo SSH OK'

      - name: Validate production runtime secrets
        run: |
          set -Eeuo pipefail

          missing=()
          required=(
            PRODUCTION_SESSION_SECRET
            PRODUCTION_MFA_ENCRYPTION_KEY
            PRODUCTION_APP_BASE_URL
            PRODUCTION_AI_INTEGRATIONS_OPENAI_API_KEY
            PRODUCTION_AI_INTEGRATIONS_OPENAI_BASE_URL
            PRODUCTION_AI_INTEGRATIONS_OPENAI_MODEL
          )

          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("${name#PRODUCTION_}")
            fi
          done

          if [ -z "${PRODUCTION_CSRF_TRUSTED_ORIGINS:-}" ] && [ -z "${PRODUCTION_REPLIT_DOMAINS:-}" ]; then
            missing+=("CSRF_TRUSTED_ORIGINS or REPLIT_DOMAINS")
          fi

          if [ -z "${PRODUCTION_DATABASE_URL:-}" ]; then
            # DATABASE_URL may already exist in the live runtime; do not print it.
            if ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "test -f /root/ESG/.env && grep -Eq '^[[:space:]]*DATABASE_URL=.+$' /root/ESG/.env || node -e 'const { execFileSync } = require(\"node:child_process\"); const processes = JSON.parse(execFileSync(\"pm2\", [\"jlist\"], { encoding: \"utf8\" })); const app = processes.find((entry) => entry.name === \"esg\"); process.exit(app?.pm2_env?.env?.DATABASE_URL ? 0 : 1);'"; then
              echo "DATABASE_URL: using existing production runtime configuration"
            else
              missing+=("DATABASE_URL")
            fi
          fi

          if [ "${PRODUCTION_AI_INTEGRATIONS_OPENAI_BASE_URL}" != "https://api.openai.com/v1" ]; then
            echo "::error::AI_INTEGRATIONS_OPENAI_BASE_URL must be https://api.openai.com/v1"
            exit 1
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required production runtime secrets: %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi

          echo "Required production runtime secrets are present"

      - name: Build production runtime env file
        run: |
          set -Eeuo pipefail
          umask 077

          node <<'NODE'
          const fs = require("node:fs");

          const keys = [
            ["NODE_ENV", "production"],
            ["DATABASE_URL", process.env.PRODUCTION_DATABASE_URL],
            ["SESSION_SECRET", process.env.PRODUCTION_SESSION_SECRET],
            ["MFA_ENCRYPTION_KEY", process.env.PRODUCTION_MFA_ENCRYPTION_KEY],
            ["APP_BASE_URL", process.env.PRODUCTION_APP_BASE_URL],
            ["CSRF_TRUSTED_ORIGINS", process.env.PRODUCTION_CSRF_TRUSTED_ORIGINS],
            ["REPLIT_DOMAINS", process.env.PRODUCTION_REPLIT_DOMAINS],
            ["RESEND_API_KEY", process.env.PRODUCTION_RESEND_API_KEY],
            ["AI_INTEGRATIONS_OPENAI_API_KEY", process.env.PRODUCTION_AI_INTEGRATIONS_OPENAI_API_KEY],
            ["AI_INTEGRATIONS_OPENAI_BASE_URL", process.env.PRODUCTION_AI_INTEGRATIONS_OPENAI_BASE_URL],
            ["AI_INTEGRATIONS_OPENAI_MODEL", process.env.PRODUCTION_AI_INTEGRATIONS_OPENAI_MODEL],
            ["STRIPE_SECRET_KEY", process.env.PRODUCTION_STRIPE_SECRET_KEY],
            ["STRIPE_WEBHOOK_SECRET", process.env.PRODUCTION_STRIPE_WEBHOOK_SECRET],
            ["STRIPE_PRO_PRICE_ID", process.env.PRODUCTION_STRIPE_PRO_PRICE_ID],
          ];

          const quote = (value) => JSON.stringify(String(value ?? ""));
          const lines = [
            "# Generated by GitHub Actions Deploy to Hetzner. Do not edit manually.",
            "# Secret values are intentionally not printed in workflow logs.",
          ];

          for (const [key, value] of keys) {
            if (value === undefined || value === "") continue;
            lines.push(`${key}=${quote(value)}`);
          }

          fs.writeFileSync("production.env", `${lines.join("\n")}\n`, { mode: 0o600 });
          NODE

      - name: Upload production runtime env file
        run: |
          set -Eeuo pipefail
          remote_env="/tmp/esg.production.env.${GITHUB_RUN_ID}"
          scp production.env ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:"${remote_env}"
          # shellcheck disable=SC2029
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "set -Eeuo pipefail; REMOTE_ENV='${remote_env}' node" <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");

          const target = "/root/ESG/.env";
          const next = "/root/ESG/.env.next";
          const remoteEnv = process.env.REMOTE_ENV;

          const parseEnv = (content) => {
            const env = {};
            for (const line of content.split(/\r?\n/)) {
              const trimmed = line.trim();
              if (!trimmed || trimmed.startsWith("#")) continue;
              const index = trimmed.indexOf("=");
              if (index === -1) continue;
              const key = trimmed.slice(0, index).trim();
              let value = trimmed.slice(index + 1).trim();
              if (
                (value.startsWith("\"") && value.endsWith("\"")) ||
                (value.startsWith("'") && value.endsWith("'"))
              ) {
                value = value.slice(1, -1);
              }
              env[key] = value;
            }
            return env;
          };

          const quote = (value) => JSON.stringify(String(value ?? ""));
          const uploaded = parseEnv(fs.readFileSync(remoteEnv, "utf8"));
          const existing = fs.existsSync(target) ? parseEnv(fs.readFileSync(target, "utf8")) : {};

          let pm2Env = {};
          try {
            const processes = JSON.parse(execFileSync("pm2", ["jlist"], { encoding: "utf8" }));
            const app = processes.find((entry) => entry.name === "esg");
            pm2Env = app?.pm2_env?.env || {};
          } catch {
            pm2Env = {};
          }

          const databaseUrl = uploaded.DATABASE_URL || existing.DATABASE_URL || pm2Env.DATABASE_URL;
          if (!databaseUrl) {
            console.error("::error::DATABASE_URL is missing from GitHub secrets and existing production runtime configuration");
            process.exit(1);
          }

          uploaded.DATABASE_URL = databaseUrl;

          const lines = [
            "# Generated by GitHub Actions Deploy to Hetzner. Do not edit manually.",
            "# Secret values are intentionally not printed in workflow logs.",
          ];

          for (const [key, value] of Object.entries(uploaded)) {
            if (value === undefined || value === "") continue;
            lines.push(`${key}=${quote(value)}`);
          }

          fs.writeFileSync(next, `${lines.join('\n')}\n`, { mode: 0o600 });
          fs.renameSync(next, target);
          fs.rmSync(remoteEnv, { force: true });
          console.log("DATABASE_URL: configured");
          console.log("Production runtime env file updated");
          NODE

      - name: Deploy
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -Eeuo pipefail

            log() {
              echo
              echo "==> $1"
            }

            wait_for_url() {
              local name="$1"
              local url="$2"
              local attempts="${3:-30}"
              local delay_seconds="${4:-2}"

              for attempt in $(seq 1 "$attempts"); do
                if curl --fail --silent --show-error --max-time 15 "$url"; then
                  echo
                  echo "$name is responding"
                  return 0
                fi
                echo "$name not ready yet (${attempt}/${attempts}); retrying in ${delay_seconds}s"
                sleep "$delay_seconds"
              done

              echo "::error::$name did not respond after ${attempts} attempts" >&2
              return 1
            }

            verify_dependency_resolution() {
              sync
              node -e '
                const packages = [
                  "@vitejs/plugin-react",
                  "class-variance-authority",
                  "lodash/max",
                  "recharts",
                ];

                for (const packageName of packages) {
                  const resolved = require.resolve(packageName);
                  console.log(`${packageName} -> ${resolved}`);
                }
              '
            }

            DEPLOY_STAGE="initialising"
            trap 'echo "::error::Deployment failed during: ${DEPLOY_STAGE}" >&2' ERR

            cd /root/ESG

            DEPLOY_STAGE="fetching latest main"
            log "$DEPLOY_STAGE"
            git fetch origin

            DEPLOY_STAGE="resetting checkout"
            log "$DEPLOY_STAGE"
            git reset --hard origin/main

            DEPLOY_STAGE="removing stale dependencies"
            log "$DEPLOY_STAGE"
            rm -rf node_modules

            DEPLOY_STAGE="verifying npm cache"
            log "$DEPLOY_STAGE"
            npm cache verify

            DEPLOY_STAGE="installing dependencies"
            log "$DEPLOY_STAGE"
            if ! npm ci --include=dev; then
              echo "::error::npm ci failed; removing partial node_modules before exiting" >&2
              rm -rf node_modules
              exit 1
            fi

            DEPLOY_STAGE="verifying dependency resolution"
            log "$DEPLOY_STAGE"
            verify_dependency_resolution

            DEPLOY_STAGE="building application"
            log "$DEPLOY_STAGE"
            if ! npm run build; then
              echo "::warning::Initial build failed after clean install; rechecking dependency resolution and retrying once" >&2
              verify_dependency_resolution
              npm run build
            fi

            DEPLOY_STAGE="copying runtime assets"
            log "$DEPLOY_STAGE"
            cp node_modules/connect-pg-simple/table.sql dist/table.sql

            DEPLOY_STAGE="restarting pm2 process"
            log "$DEPLOY_STAGE"
            set -a
            . /root/ESG/.env
            set +a
            pm2 restart esg --update-env

            DEPLOY_STAGE="checking pm2 status"
            log "$DEPLOY_STAGE"
            pm2 status

            DEPLOY_STAGE="checking pm2 runtime environment"
            log "$DEPLOY_STAGE"
            node -e '
              const { execFileSync } = require("node:child_process");
              const processes = JSON.parse(execFileSync("pm2", ["jlist"], { encoding: "utf8" }));
              const app = processes.find((entry) => entry.name === "esg");
              if (!app) {
                console.error("::error::PM2 process esg was not found");
                process.exit(1);
              }

              const env = app.pm2_env?.env || {};
              const checks = [
                ["DATABASE_URL", Boolean(env.DATABASE_URL)],
                ["AI_INTEGRATIONS_OPENAI_API_KEY", Boolean(env.AI_INTEGRATIONS_OPENAI_API_KEY)],
                ["AI_INTEGRATIONS_OPENAI_BASE_URL", env.AI_INTEGRATIONS_OPENAI_BASE_URL === "https://api.openai.com/v1"],
                ["AI_INTEGRATIONS_OPENAI_MODEL", Boolean(env.AI_INTEGRATIONS_OPENAI_MODEL)],
              ];

              const missing = checks.filter(([, ok]) => !ok).map(([name]) => name);
              for (const [name, ok] of checks) {
                console.log(`${name}: ${ok ? "configured" : "missing-or-invalid"}`);
              }

              if (missing.length > 0) {
                console.error(`::error::PM2 runtime environment missing or invalid: ${missing.join(", ")}`);
                process.exit(1);
              }
            '

            DEPLOY_STAGE="checking health endpoint"
            log "$DEPLOY_STAGE"
            wait_for_url "health endpoint" "http://127.0.0.1:5000/health"

            DEPLOY_STAGE="checking app shell"
            log "$DEPLOY_STAGE"
            wait_for_url "app shell" "http://127.0.0.1:5000/"

            log "deployment completed"
          EOF
