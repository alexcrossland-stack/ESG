name: Deploy to Hetzner

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: "Type production to confirm this deploy targets production"
        required: true

permissions:
  contents: read
  checks: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 75

    env:
      CONFIRM_TARGET: ${{ inputs.confirm_target }}
      PRODUCTION_APP_BASE_URL: https://www.simplyesg.co.uk
      PRODUCTION_CSRF_TRUSTED_ORIGINS: https://www.simplyesg.co.uk
      PRODUCTION_REPLIT_DOMAINS: www.simplyesg.co.uk,simplyesg.co.uk
      PRODUCTION_SSH_HOST_KEY_FINGERPRINT: SHA256:AzWNDakbRpAOwbFO9LJgo7ZBcS5OPFVjBzFCHFioIvo

    steps:
      - name: Validate production deploy confirmation
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "${CONFIRM_TARGET}" != "production" ]; then
            echo "::error::confirm_target must be exactly 'production'"
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Production deployment must be dispatched from main"
            exit 1
          fi

      - name: Checkout remote main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Verify checkout and release gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin refs/heads/main
          deploy_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse FETCH_HEAD)"
          if [ "${deploy_sha}" != "${remote_sha}" ]; then
            echo "::error::Checked-out SHA ${deploy_sha} is not remote main ${remote_sha}"
            exit 1
          fi
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${deploy_sha}/check-runs" --jq '[.check_runs[] | select(.name == "SME release acceptance")] | sort_by(.completed_at) | last | .conclusion // "missing"')"
          if [ "${conclusion}" != "success" ]; then
            echo "::error::SME release acceptance for ${deploy_sha} is ${conclusion}; production deploy is blocked"
            exit 1
          fi
          echo "DEPLOY_SHA=${deploy_sha}" >> "${GITHUB_ENV}"
          echo "Verified successful SME release acceptance for ${deploy_sha}"

      - name: Validate and render production runtime configuration
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRODUCTION_SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PRODUCTION_MFA_ENCRYPTION_KEY: ${{ secrets.MFA_ENCRYPTION_KEY }}
          PRODUCTION_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PRODUCTION_EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          PRODUCTION_AI_INTEGRATIONS_OPENAI_API_KEY: ${{ secrets.AI_INTEGRATIONS_OPENAI_API_KEY }}
          PRODUCTION_AI_INTEGRATIONS_OPENAI_BASE_URL: ${{ secrets.AI_INTEGRATIONS_OPENAI_BASE_URL }}
          PRODUCTION_AI_INTEGRATIONS_OPENAI_MODEL: ${{ secrets.AI_INTEGRATIONS_OPENAI_MODEL }}
          PRODUCTION_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PRODUCTION_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PRODUCTION_STRIPE_PRO_PRICE_ID: ${{ secrets.STRIPE_PRO_PRICE_ID }}
          PRODUCTION_FEATURE_ESTIMATION_ENABLED: ${{ secrets.FEATURE_ESTIMATION_ENABLED }}
          PRODUCTION_FEATURE_PORTFOLIO_ENABLED: ${{ secrets.FEATURE_PORTFOLIO_ENABLED }}
          PRODUCTION_FEATURE_REPORT_GENERATION_ENABLED: ${{ secrets.FEATURE_REPORT_GENERATION_ENABLED }}
          PRODUCTION_SESSION_ABSOLUTE_LIFETIME_MS: ${{ secrets.SESSION_ABSOLUTE_LIFETIME_MS }}
          PRODUCTION_SESSION_COOKIE_SECURE: ${{ secrets.SESSION_COOKIE_SECURE }}
          PRODUCTION_SESSION_IDLE_TIMEOUT_MS: ${{ secrets.SESSION_IDLE_TIMEOUT_MS }}
          PRODUCTION_STEP_UP_VALIDITY_MS: ${{ secrets.STEP_UP_VALIDITY_MS }}
          PRODUCTION_SLACK_SECURITY_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}
          PRODUCTION_AGENT_SERVICE_URL: ${{ secrets.AGENT_SERVICE_URL }}
          PRODUCTION_AGENT_WEBHOOK_URL: ${{ secrets.AGENT_WEBHOOK_URL }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          missing=()
          required=(
            PRODUCTION_SESSION_SECRET
            PRODUCTION_MFA_ENCRYPTION_KEY
            PRODUCTION_APP_BASE_URL
            PRODUCTION_AI_INTEGRATIONS_OPENAI_API_KEY
            PRODUCTION_AI_INTEGRATIONS_OPENAI_BASE_URL
            PRODUCTION_AI_INTEGRATIONS_OPENAI_MODEL
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("${name#PRODUCTION_}")
            fi
          done
          if [ -z "${PRODUCTION_CSRF_TRUSTED_ORIGINS:-}" ] && [ -z "${PRODUCTION_REPLIT_DOMAINS:-}" ]; then
            missing+=("CSRF_TRUSTED_ORIGINS or REPLIT_DOMAINS")
          fi
          if [ "${PRODUCTION_AI_INTEGRATIONS_OPENAI_BASE_URL}" != "https://api.openai.com/v1" ]; then
            echo "::error::AI_INTEGRATIONS_OPENAI_BASE_URL must be https://api.openai.com/v1"
            exit 1
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required production runtime secrets: %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi
          node scripts/deployment/runtime-env.cjs render production.env PRODUCTION_ "${DEPLOY_SHA}"

      - name: Start isolated ssh-agent and add deploy key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "${GITHUB_ENV}"
          echo "SSH_AGENT_PID=${SSH_AGENT_PID}" >> "${GITHUB_ENV}"
          ssh-add - <<< "${DEPLOY_SSH_PRIVATE_KEY}"

      - name: Establish verified SSH host identity
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          scan_file="$(mktemp)"
          trap 'rm -f "${scan_file}"' EXIT
          ssh-keyscan -t ed25519 -H "${{ secrets.SERVER_HOST }}" > "${scan_file}"
          actual_fingerprint="$(ssh-keygen -lf "${scan_file}" -E sha256 | awk 'NR == 1 { print $2 }')"
          if [ "${actual_fingerprint}" != "${PRODUCTION_SSH_HOST_KEY_FINGERPRINT}" ]; then
            echo "::error::Production SSH host key fingerprint mismatch"
            exit 1
          fi
          cat "${scan_file}" >> ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" 'echo SSH OK'

      - name: Upload isolated deployment inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          tools_dir="/tmp/esg-deploy-tools.${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_env="/tmp/esg.production.env.${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # tools_dir is a fixed prefix plus numeric GitHub IDs.
          # shellcheck disable=SC2029
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "install -d -m 700 '${tools_dir}'"
          scp \
            scripts/deployment/runtime-env.cjs \
            scripts/deployment/recovery-point.cjs \
            scripts/deployment/remote-production.sh \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${tools_dir}/"
          scp production.env "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${remote_env}"
          echo "REMOTE_TOOLS_DIR=${tools_dir}" >> "${GITHUB_ENV}"
          echo "REMOTE_ENV_PATH=${remote_env}" >> "${GITHUB_ENV}"

      - name: Build, recoverability-check and atomically deploy
        id: atomic_deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          unit_name="simplyesg-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # The server-side systemd unit survives an Actions cancellation or
          # SSH channel loss and therefore always reaches success or rollback.
          # Interpolated values are generated numeric IDs, a validated SHA, or fixed paths.
          # shellcheck disable=SC2029
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "command -v systemd-run >/dev/null && systemd-run --unit='${unit_name}' --property=Type=exec --property=RemainAfterExit=yes --setenv=DEPLOY_SHA='${DEPLOY_SHA}' --setenv=GITHUB_RUN_ID='${GITHUB_RUN_ID}' --setenv=GITHUB_RUN_ATTEMPT='${GITHUB_RUN_ATTEMPT}' --setenv=REMOTE_ENV_PATH='${REMOTE_ENV_PATH}' --setenv=TOOLS_DIR='${REMOTE_TOOLS_DIR}' /usr/bin/bash '${REMOTE_TOOLS_DIR}/remote-production.sh'"

          for attempt in $(seq 1 360); do
            # shellcheck disable=SC2029
            unit_state="$(ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "systemctl show '${unit_name}' --property=ActiveState --property=SubState --property=ExecMainStatus")"
            active_state="$(awk -F= '$1 == "ActiveState" { print $2 }' <<< "${unit_state}")"
            sub_state="$(awk -F= '$1 == "SubState" { print $2 }' <<< "${unit_state}")"
            exit_status="$(awk -F= '$1 == "ExecMainStatus" { print $2 }' <<< "${unit_state}")"
            if { [ "${active_state}" = "active" ] && [ "${sub_state}" = "exited" ]; } || [ "${active_state}" = "failed" ]; then
              if [ "${active_state}" = "active" ] && [ "${sub_state}" = "exited" ] && [ "${exit_status}" = "0" ]; then
                echo "Detached production deployment completed successfully"
                # shellcheck disable=SC2029
                ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "systemctl stop '${unit_name}'" || true
                exit 0
              fi
              echo "::error::Detached deployment ended state=${active_state}/${sub_state} status=${exit_status}"
              # The deployment log contains stage names and command output, not runtime secret values.
              # shellcheck disable=SC2029
              ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "journalctl --unit='${unit_name}' --no-pager --lines=200" || true
              exit 1
            fi
            echo "Detached deployment state=${active_state}/${sub_state} (${attempt}/360)"
            sleep 10
          done

          echo "::error::Timed out waiting for the detached deployment; the server-side unit remains responsible for completing or rolling back"
          exit 1

      - name: Verify public production release and safe anonymous contracts
        env:
          PUBLIC_BASE_URL: https://www.simplyesg.co.uk
        shell: bash
        run: |
          set -Eeuo pipefail
          base_url="${PUBLIC_BASE_URL%/}"
          health_json="$(curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 30 -H 'Cache-Control: no-cache' "${base_url}/health")"
          HEALTH_JSON="${health_json}" EXPECTED_SHA="${DEPLOY_SHA}" node <<'NODE'
          const health = JSON.parse(process.env.HEALTH_JSON);
          const expected = process.env.EXPECTED_SHA;
          const age = Math.abs(Date.now() - Date.parse(health.timestamp));
          if (health.status !== "ok" || health.db !== "connected" || health.scheduler !== "running") {
            throw new Error(`Public health is degraded: ${JSON.stringify(health)}`);
          }
          if (health.releaseSha !== expected) throw new Error(`Public release SHA ${health.releaseSha} does not match ${expected}`);
          if (!Number.isFinite(age) || age > 300000) throw new Error(`Public health timestamp is stale: ${health.timestamp}`);
          console.log(`Public health confirms release ${expected}`);
          NODE

          for route in / /auth /terms /privacy /cookies /dpa; do
            status="$(curl --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 30 --output /dev/null --write-out '%{http_code}' "${base_url}${route}")"
            test "${status}" = "200" || { echo "::error::${route} expected 200, got ${status}"; exit 1; }
          done
          for route in /api/auth/me /api/company /api/metrics /api/reports /api/evidence /api/framework-readiness; do
            status="$(curl --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 30 --output /dev/null --write-out '%{http_code}' "${base_url}${route}")"
            test "${status}" = "401" || { echo "::error::${route} expected 401, got ${status}"; exit 1; }
          done
          status="$(curl --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 30 --output /dev/null --write-out '%{http_code}' "${base_url}/api/company/esg-profile/public/codex-nonexistent-smoke-token")"
          test "${status}" = "404" || { echo "::error::invalid public token expected 404, got ${status}"; exit 1; }

          headers="$(curl --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 30 --dump-header - --output /dev/null "${base_url}/")"
          for header in content-security-policy strict-transport-security x-content-type-options x-frame-options referrer-policy permissions-policy; do
            printf '%s' "${headers}" | tr -d '\r' | grep -qi "^${header}:" || { echo "::error::Missing ${header}"; exit 1; }
          done

      - name: Record production release summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Production release"
            echo "- Target SHA: \`${DEPLOY_SHA:-unavailable}\`"
            echo "- Release directory: \`/root/esg-releases/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${DEPLOY_SHA:0:12}\`"
            echo "- Recovery point root: \`/root/esg-deploy-backups/\`"
            if [ "${{ steps.atomic_deploy.outcome }}" = "success" ]; then
              echo "- Database and evidence restore rehearsal: passed before write pause"
            else
              echo "- Database and evidence restore rehearsal: not completed or deployment failed; inspect the failed step"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove runner-side production configuration
        if: always()
        shell: bash
        run: |
          rm -f production.env
          if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k >/dev/null 2>&1 || true; fi
