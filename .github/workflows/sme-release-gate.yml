name: SME release gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sme-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: SME release acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: simplyesg
          POSTGRES_PASSWORD: simplyesg-ci
          POSTGRES_DB: simplyesg_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simplyesg -d simplyesg_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "1"
      DATABASE_URL: postgresql://simplyesg:simplyesg-ci@127.0.0.1:5432/simplyesg_ci
      SESSION_SECRET: simplyesg-ci-session-secret-2026
      MFA_ENCRYPTION_KEY: simplyesg-ci-mfa-encryption-key-2026
      BASE_URL: http://127.0.0.1:5000
      PORT: "5000"
      REGRESSION_TEST: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Rehearse full database and evidence recovery
        env:
          RECOVERY_REHEARSAL_DATABASE_URL: postgresql://simplyesg:simplyesg-ci@127.0.0.1:5432/simplyesg_ci
        run: npm run test:recovery-rehearsal

      - name: Rehearse production a178 upgrade twice
        env:
          UPGRADE_REHEARSAL_DB_NAME: simplyesg_ci
        run: npm run test:upgrade-rehearsal

      - name: Recreate clean acceptance database schema
        run: |
          psql "${DATABASE_URL}" --set ON_ERROR_STOP=on --command 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          npm run db:push

      - name: Start application
        run: |
          npm run dev > /tmp/simplyesg-ci-server.log 2>&1 &
          app_pid=$!
          echo "${app_pid}" > /tmp/simplyesg-ci-server.pid
          for _ in $(seq 1 60); do
            # REGRESSION_TEST intentionally leaves the scheduler stopped, so
            # /health correctly remains degraded. The app shell is the CI
            # readiness signal; production deployment separately requires a
            # running scheduler and an exact release SHA.
            if curl --fail --silent http://127.0.0.1:5000/ > /dev/null; then
              exit 0
            fi
            if ! kill -0 "${app_pid}" 2>/dev/null; then
              cat /tmp/simplyesg-ci-server.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/simplyesg-ci-server.log
          exit 1

      - name: Run fail-closed SME release acceptance
        env:
          STRICT_RELEASE: "1"
          RUN_E2E_RELEASE: "1"
        run: npm run test:release

      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sme-release-acceptance
          if-no-files-found: ignore
          path: |
            test-results/
            playwright-report/
            /tmp/simplyesg-ci-server.log
